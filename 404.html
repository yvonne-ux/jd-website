<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JonDavidson Group</title>
<script>
  // GitHub Pages is static hosting with no server-side rewrites, so a direct
  // link or hard refresh on a clean route (e.g. /jd-website/contact) 404s
  // here instead of reaching index.html. This re-encodes the intended path
  // into a query string and redirects to the site root, where a matching
  // script in index.html's <head> decodes it back into the real URL via
  // history.replaceState before the page's own router reads location.
  // Standard technique: https://github.com/rafgraph/spa-github-pages
  //
  // pathSegmentsToKeep = 0 because the site is served from the root of a
  // custom domain (jondavidsongroup.com on Cloudflare Pages). It was 1 when
  // this was a GitHub Pages project site under /jd-website/; leaving it at 1
  // on a root domain causes an endless /route/?/&/~and~... redirect loop.
  var pathSegmentsToKeep = 0;
  var l = window.location;
  // Loop guard / self-heal: if we're already carrying the encoded "?/" query
  // from an earlier redirect and still hit this 404, redirecting again would
  // just stack more "&/~and~" onto the URL forever. Instead strip the query
  // and trailing slashes (e.g. /meet-team/?/&/~and~... -> /meet-team) and
  // retry the clean path once.
  if (l.search.charAt(1) === '/') {
    l.replace(l.pathname.replace(/\/+$/, '') || '/');
  } else
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1F3A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  p{color:rgba(255,255,255,0.6);font-size:14px;}
</style>
</head>
<body>
<p>Redirecting&hellip;</p>
</body>
</html>
